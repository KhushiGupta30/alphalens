version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://alphauser:alphapass@db:5432/alphalens
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=changethislater
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: alphauser
      POSTGRES_PASSWORD: alphapass
      POSTGRES_DB: alphalens
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: